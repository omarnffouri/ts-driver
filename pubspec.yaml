  firebase_core: ^4.10.0
  flutter_local_notifications: ^18.0.1
  awesome_snackbar_content: ^0.1.8
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  uuid: ^4.1.0
  file_picker: ^8.3.1
  package_info_plus: ^8.0.2
  shimmer: ^3.0.0
  location: ^5.0.3
