plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
   def keystorePropertiesFile = rootProject.file('key.properties')
   if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
   }

// Short HEAD hash for APK naming; "nogit" when not in a git checkout.
def gitCommitHash = {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def hash = stdout.toString().trim()
        return hash ?: 'nogit'
    } catch (ignored) {
        return 'nogit'
    }
}()

android {
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId 'com.transport_system.ts_driver'
        compileSdk 36
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        ndk {
            // Filter for architectures supported by Flutter.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Versioned APK names, e.g. ts_driver-v1.18.1+1181-a1b2c3d-release.apk
    // (prod keeps the historical name; other flavors add their name).
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def flavorPart = variant.flavorName == 'prod' ? '' : "-${variant.flavorName}"
            output.outputFileName = "ts_driver-v${variant.versionName}+${variant.versionCode}-${gitCommitHash}${flavorPart}-${variant.buildType.name}.apk"
        }
    }

    viewBinding {
        enabled = true
    }

    namespace 'com.transport_system.ts_driver'
}

// `flutter build appbundle --flavor prod` always emits app-prod-release.aab and
// Flutter expects that name, so write a versioned copy beside it instead of renaming.
tasks.matching { it.name == 'bundleProdRelease' }.configureEach { task ->
    task.doLast {
        def dir = layout.buildDirectory.dir('outputs/bundle/prodRelease').get().asFile
        def src = new File(dir, 'app-prod-release.aab')
        if (src.exists()) {
            def dest = new File(dir,
                "ts_driver-v${android.defaultConfig.versionName}+${android.defaultConfig.versionCode}-${gitCommitHash}-release.aab")
            java.nio.file.Files.copy(src.toPath(), dest.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

flutter {
    source '../..'
}

